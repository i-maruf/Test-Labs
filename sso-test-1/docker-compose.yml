services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
      POSTGRES_DB: ssodb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso -d ssodb"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  idp:
    build: .
    command: sh -c "python wait_for_db.py && gunicorn --bind 0.0.0.0:5000 --workers 1 --timeout 90 idp_app:app"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sso:sso@db:5432/ssodb
      IDP_ISSUER: http://localhost:8080/oidc
      IDP_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      IDP_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      IDP_KEY_DIR: /data/keys
    volumes:
      - idpkeys:/data/keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sso:sso@db:5432/ssodb
    depends_on:
      db:
        condition: service_healthy
      idp:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - idp
    restart: unless-stopped

volumes:
  pgdata:
  idpkeys:
